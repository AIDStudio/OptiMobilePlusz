plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// Itt adjuk meg a letöltési forrásokat
repositories {
    maven {
        url = uri("https://maven.terraformersmc.com/releases/")
        metadataSources {
            mavenPom()
        }
    } // ModMenu helye
    maven {
        url = uri("https://maven.fabricmc.net/")
        metadataSources {
            artifact()
            mavenPom()
        }
    } // Fabric API helye
    mavenCentral() // Általános Java könyvtárak
}

// Disable remapping of outputs (we rely on Mojang's official names for 26.1+)
loom {
    dontRemapOutputs()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Use a local identity mappings jar so Loom finds a `named` namespace.
    mappings files('libs/official-mappings.jar')

    // For Minecraft 26.1+, Minecraft is unobfuscated — no intermediary/yarn mappings required.
    // Use the new Loom (non-remapping) workflow: use standard configurations `implementation` / `compileOnly`.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Mod Menu integráció (compile-time/runtime dependency)
    implementation "com.terraformersmc:modmenu:11.0.1"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
